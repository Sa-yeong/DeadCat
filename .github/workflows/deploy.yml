name: Deploy to AWS Lightsail
on:
  push:
    branches:
      - integration-livingroom
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e

            # NVM 환경 설정
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] || exit 1
            . "$NVM_DIR/nvm.sh"
            nvm use 20

            # 배포 환경 확인
            node -v
            npm -v
            pm2 -v

            cd /home/ubuntu/DeadCat
            git pull origin integration-livingroom
            cd backend
            npm install
            npx prisma generate
            npm run build
            cd ../fe
            npm install
            npm run build
            cd ../
            pm2 restart all
